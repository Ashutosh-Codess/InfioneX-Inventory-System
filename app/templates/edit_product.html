{% extends "base.html" %}
{% block content %}
<div class="container narrow-container">
  <section class="panel">
    <div class="panel-heading">
      <div>
        <p class="eyebrow">Product management</p>
        <h1>Edit product</h1>
      </div>
      <a href="/dashboard">Back to dashboard</a>
    </div>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    {% set values = form_data if form_data else {'name': product.name, 'sku': product.sku, 'price': product.price, 'stock': product.stock} %}
    <form method="post" action="/products/{{ product.id }}/edit" class="edit-form">
      <label for="name">Product name</label>
      <input id="name" name="name" maxlength="120" required value="{{ values.get('name', '') }}">
      <label for="sku">SKU</label>
      <input id="sku" name="sku" maxlength="50" required value="{{ values.get('sku', '') }}">
      <label for="price">Price</label>
      <input id="price" name="price" type="number" min="0" step="0.01" required value="{{ values.get('price', '') }}">
      <label for="stock">Stock</label>
      <input id="stock" name="stock" type="number" min="0" required value="{{ values.get('stock', '') }}">
      <div class="form-actions">
        <a class="button-secondary" href="/dashboard">Cancel</a>
        <button type="submit">Save changes</button>
      </div>
    </form>
  </section>
</div>
{% endblock %}
